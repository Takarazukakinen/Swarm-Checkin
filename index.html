<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swarm Check-in for X</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; color: #333; }
    h3 { margin-bottom: 16px; font-size: 20px; text-align: center; }
    label { font-size: 14px; font-weight: bold; margin-bottom: 6px; display: block; color: #555; }
    input[type="text"] { width: 100%; padding: 12px; box-sizing: border-box; margin-bottom: 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; transition: border-color 0.2s; }
    input[type="text"]:focus { border-color: #1da1f2; }
    .btn-group { display: flex; gap: 8px; margin-bottom: 14px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .btn-parse { background: #e8f5fe; color: #1da1f2; }
    .btn-parse:hover { background: #d0ebff; }
    .btn-tweet { width: 100%; padding: 14px; background: #1da1f2; color: white; font-size: 16px; margin-top: 8px; }
    .btn-tweet:hover { background: #0c85d0; }
    #status { margin-top: 10px; font-size: 14px; color: #007bff; font-weight: bold; text-align: center; min-height: 20px; }
    .preview-box { background: #f7f9fa; border: 1px solid #e1e8ed; border-radius: 8px; padding: 12px; margin-top: 16px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
    .preview-title { font-size: 12px; color: #657786; font-weight: bold; margin-bottom: 4px; }
  </style>
</head>
<body>
  <h3>Swarm チェックイン X投稿</h3>
  
  <label for="swarmUrl">Swarm共有URL：</label>
  <input type="text" id="swarmUrl" placeholder="https://app.foursquare.com/share/checkin/..." oninput="onUrlInput()">

  <label for="placeName">取得・確認された場所名（編集可）：</label>
  <input type="text" id="placeName" placeholder="URL入力後に自動取得（手動入力も可）" oninput="updatePreview()">

  <div class="btn-group">
    <button class="btn-parse" onclick="parseLocation()">場所名を再取得</button>
  </div>

  <div id="status"></div>

  <div class="preview-box">
    <div class="preview-title">投稿プレビュー</div>
    <div id="tweetPreview">I'm at</div>
  </div>

  <button class="btn-tweet" onclick="sendTweet()">Xアプリでツイートする</button>

  <script>
    const MY_USER_ID = "58771976";

    function decodeEntities(encodedString) {
      const textarea = document.createElement('textarea');
      textarea.innerHTML = encodedString;
      return textarea.value;
    }

    function cleanPlaceName(text) {
      if (!text) return "";
      let cleaned = decodeEntities(text);

      cleaned = cleaned
        .replace(/^.*?'s check in at\s*/i, '')
        .replace(/^.*?'s checkin at\s*/i, '')
        .replace(/^I'm at\s*/i, '')
        .replace(/ - Swarm$/i, '')
        .replace(/Swarm$/i, '')
        .trim();

      return cleaned;
    }

    function getOldFormatUrl(inputUrl) {
      if (inputUrl.includes('app.foursquare.com/share/checkin/')) {
        return inputUrl
          .replace('app.foursquare.com/share/checkin/', `ja.swarmapp.com/user/${MY_USER_ID}/checkin/`)
          .replace('&lang=ja', '');
      }
      return inputUrl;
    }

    function updatePreview() {
      const place = document.getElementById('placeName').value.trim();
      const inputUrl = document.getElementById('swarmUrl').value.trim();
      const oldUrl = getOldFormatUrl(inputUrl);

      const prefix = place ? `I'm at ${place}` : "I'm at";
      const tweetText = oldUrl ? `${prefix}\n${oldUrl}` : prefix;

      document.getElementById('tweetPreview').innerText = tweetText;
      return tweetText;
    }

    async function parseLocation() {
      const inputUrl = document.getElementById('swarmUrl').value.trim();
      const status = document.getElementById('status');

      if (!inputUrl) {
        status.innerText = "";
        updatePreview();
        return;
      }

      status.innerText = "場所情報を解析中...";

      const targetUrl = getOldFormatUrl(inputUrl);
      let extractedName = "";

      // 方法1: Microlink OGP API (リダイレクト・Cloudflare回避に非常に強い)
      try {
        const res = await fetch(`https://api.microlink.io?url=${encodeURIComponent(targetUrl)}`);
        const data = await res.json();
        if (data && data.status === 'success' && data.data) {
          const title = data.data.title || (data.data.publisher ? data.data.publisher : "");
          if (title) {
            extractedName = cleanPlaceName(title);
          }
        }
      } catch (e) {
        console.warn("Microlink API failed", e);
      }

      // 方法2: Microlinkで失敗した場合、入力元のapp.foursquare.com URLで直接リトライ
      if (!extractedName) {
        try {
          const res = await fetch(`https://api.microlink.io?url=${encodeURIComponent(inputUrl)}`);
          const data = await res.json();
          if (data && data.status === 'success' && data.data && data.data.title) {
            extractedName = cleanPlaceName(data.data.title);
          }
        } catch (e) {
          console.warn("Microlink fallback failed", e);
        }
      }

      if (extractedName) {
        document.getElementById('placeName').value = extractedName;
        status.innerText = "場所名を取得しました！";
      } else {
        status.innerText = "自動取得できませんでした（手動で入力できます）";
      }

      updatePreview();
    }

    let timer = null;
    function onUrlInput() {
      updatePreview();
      clearTimeout(timer);
      timer = setTimeout(() => {
        parseLocation();
      }, 500);
    }

    function sendTweet() {
      const inputUrl = document.getElementById('swarmUrl').value.trim();
      if (!inputUrl) {
        alert('Swarm共有URLを入力してください');
        return;
      }

      const tweetText = updatePreview();

      const appUrl = `twitter://post?text=${encodeURIComponent(tweetText)}`;
      const webUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetText)}`;

      window.location.href = appUrl;
      setTimeout(() => {
        window.location.href = webUrl;
      }, 1000);
    }
  </script>
</body>
</html>
