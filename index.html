<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swarm Check-in for X</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
    input { width: 100%; padding: 12px; box-sizing: border-box; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    button { width: 100%; padding: 14px; background: #1da1f2; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    #status { margin-top: 10px; font-size: 14px; color: #007bff; font-weight: bold; }
  </style>
</head>
<body>
  <h3>Swarm チェックイン X投稿</h3>
  
  <label>Swarm共有URL：</label>
  <input type="text" id="swarmUrl" placeholder="https://app.foursquare.com/share/checkin/...">

  <button onclick="convertAndTweet()">Xアプリでツイートする</button>
  <div id="status"></div>

  <script>
    const MY_USER_ID = "58771976";

    // 特殊文字のデコード関数
    function decodeEntities(encodedString) {
      const textarea = document.createElement('textarea');
      textarea.innerHTML = encodedString;
      return textarea.value;
    }

    // HTMLから場所名を抽出する処理
    function extractPlaceName(html) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');

      let rawTitle = "";

      // 1. og:title または twitter:title から取得
      const ogTitle = doc.querySelector('meta[property="og:title"]')?.getAttribute('content') ||
                      doc.querySelector('meta[name="twitter:title"]')?.getAttribute('content');

      if (ogTitle) {
        rawTitle = ogTitle;
      } else {
        // 2. なければ <title> タグから取得
        const titleElem = doc.querySelector('title');
        if (titleElem) rawTitle = titleElem.textContent;
      }

      if (!rawTitle) return "";

      rawTitle = decodeEntities(rawTitle);

      // 不要なPrefix/Suffixを削って「場所名 in 市区町村, 都道府県」の形式に整形
      return rawTitle
        .replace(/^.*?'s check in at\s*/i, '') // 「ごーと's check in at 」を消す
        .replace(/^I'm at\s*/i, '')            // 「I'm at 」を重複防止で消す
        .replace(/ - Swarm$/i, '')             // 「 - Swarm」を消す
        .replace(/Swarm$/i, '')                // 「Swarm」を消す
        .trim();
    }

    async function convertAndTweet() {
      const inputUrl = document.getElementById('swarmUrl').value.trim();
      const status = document.getElementById('status');

      if (!inputUrl) {
        alert('URLを入力してください');
        return;
      }

      status.innerText = "場所・住所情報を取得中...";

      // 旧URL形式へ変換
      let oldFormatUrl = inputUrl;
      if (inputUrl.includes('app.foursquare.com/share/checkin/')) {
        oldFormatUrl = inputUrl
          .replace('app.foursquare.com/share/checkin/', `ja.swarmapp.com/user/${MY_USER_ID}/checkin/`)
          .replace('&lang=ja', '');
      }

      let placeName = "";

      // プロキシ1: AllOrigins
      try {
        const proxyUrl1 = 'https://api.allorigins.win/get?url=' + encodeURIComponent(inputUrl);
        const res1 = await fetch(proxyUrl1);
        const data1 = await res1.json();
        if (data1 && data1.contents) {
          placeName = extractPlaceName(data1.contents);
        }
      } catch (e) {
        // エラー時はプロキシ2へフォールバック
      }

      // プロキシ1で取れなかった場合、プロキシ2: CorsProxy を試す
      if (!placeName) {
        try {
          const proxyUrl2 = 'https://corsproxy.io/?' + encodeURIComponent(inputUrl);
          const res2 = await fetch(proxyUrl2);
          const html2 = await res2.text();
          if (html2) {
            placeName = extractPlaceName(html2);
          }
        } catch (e) {
          // エラー時は取得失敗
        }
      }

      // ツイート本文の作成
      const textPrefix = placeName ? `I'm at ${placeName}` : "I'm at";
      const tweetText = `${textPrefix}\n${oldFormatUrl}`;

      status.innerText = "";

      // Xアプリ起動
      const appUrl = `twitter://post?text=${encodeURIComponent(tweetText)}`;
      const webUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetText)}`;

      window.location.href = appUrl;
      setTimeout(() => {
        window.location.href = webUrl;
      }, 1000);
    }
  </script>
</body>
</html>
