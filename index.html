<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swarm Check-in for X</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
    input { width: 100%; padding: 12px; box-sizing: border-box; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    button { width: 100%; padding: 14px; background: #1da1f2; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    #status { margin-top: 10px; font-size: 14px; color: #007bff; font-weight: bold; }
  </style>
</head>
<body>
  <h3>Swarm チェックイン X投稿</h3>
  
  <label>Swarm共有URL：</label>
  <input type="text" id="swarmUrl" placeholder="https://app.foursquare.com/share/checkin/...">

  <button onclick="convertAndTweet()">Xアプリでツイートする</button>
  <div id="status"></div>

  <script>
    const MY_USER_ID = "58771976";

    // 特殊文字のデコード関数
    function decodeEntities(encodedString) {
      const textarea = document.createElement('textarea');
      textarea.innerHTML = encodedString;
      return textarea.value;
    }

    // テキストから不要な不要語を削除して場所名をきれいに成形する
    function cleanPlaceName(text) {
      if (!text) return "";
      let cleaned = decodeEntities(text);

      // 「ごーと's check in at 荻窪駅」などのゴミを削除
      cleaned = cleaned
        .replace(/^.*?'s check in at\s*/i, '')
        .replace(/^.*?'s checkin at\s*/i, '')
        .replace(/^I'm at\s*/i, '')
        .replace(/ - Swarm$/i, '')
        .replace(/Swarm$/i, '')
        .trim();

      return cleaned;
    }

    async function convertAndTweet() {
      const inputUrl = document.getElementById('swarmUrl').value.trim();
      const status = document.getElementById('status');

      if (!inputUrl) {
        alert('URLを入力してください');
        return;
      }

      status.innerText = "場所情報を解析中...";

      // 旧URL形式へ変換
      let oldFormatUrl = inputUrl;
      if (inputUrl.includes('app.foursquare.com/share/checkin/')) {
        oldFormatUrl = inputUrl
          .replace('app.foursquare.com/share/checkin/', `ja.swarmapp.com/user/${MY_USER_ID}/checkin/`)
          .replace('&lang=ja', '');
      }

      let placeName = "";

      // ----------------------------------------------------
      // アプローチ1: APIプロキシ1 (allorigins) で全取得を狙う
      // ----------------------------------------------------
      try {
        const p1 = 'https://api.allorigins.win/get?url=' + encodeURIComponent(inputUrl);
        const r1 = await fetch(p1);
        const d1 = await r1.json();
        if (d1 && d1.contents) {
          const html = d1.contents;
          // og:title (フル場所名) または title (最低限の場所名)
          const ogMatch = html.match(/<meta[^>]*property=["']og:title["'][^>]*content=["'](.*?)["']/i);
          const titleMatch = html.match(/<title>(.*?)<\/title>/i);

          if (ogMatch && ogMatch[1]) {
            placeName = cleanPlaceName(ogMatch[1]);
          } else if (titleMatch && titleMatch[1]) {
            placeName = cleanPlaceName(titleMatch[1]);
          }
        }
      } catch (e) {}

      // ----------------------------------------------------
      // アプローチ2: 取れなかったらAPIプロキシ2 (corsproxy.io) でリトライ
      // ----------------------------------------------------
      if (!placeName) {
        try {
          const p2 = 'https://corsproxy.io/?' + encodeURIComponent(inputUrl);
          const r2 = await fetch(p2);
          const html2 = await r2.text();
          if (html2) {
            const ogMatch = html2.match(/<meta[^>]*property=["']og:title["'][^>]*content=["'](.*?)["']/i);
            const titleMatch = html2.match(/<title>(.*?)<\/title>/i);

            if (ogMatch && ogMatch[1]) {
              placeName = cleanPlaceName(ogMatch[1]);
            } else if (titleMatch && titleMatch[1]) {
              placeName = cleanPlaceName(titleMatch[1]);
            }
          }
        } catch (e) {}
      }

      // ----------------------------------------------------
      // ツイート作成＆Xアプリ起動
      // ----------------------------------------------------
      const textPrefix = placeName ? `I'm at ${placeName}` : "I'm at";
      const tweetText = `${textPrefix}\n${oldFormatUrl}`;

      status.innerText = "";

      const appUrl = `twitter://post?text=${encodeURIComponent(tweetText)}`;
      const webUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetText)}`;

      window.location.href = appUrl;
      setTimeout(() => {
        window.location.href = webUrl;
      }, 1000);
    }
  </script>
</body>
</html>
